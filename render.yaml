services:
  - type: web
    name: strivenrag-api
    runtime: python
    plan: standard
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: strivenrag-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: STRIVEN_DATA_ROOT
        value: /var/data
      - key: HF_HOME
        value: /var/data/model-cache
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /var/data/model-cache
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: STRIVEN_CORS_ORIGINS
        value: https://strivenrag.netlify.app
      - key: API_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMPLOYEE_USERNAME
        sync: false
      - key: EMPLOYEE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
